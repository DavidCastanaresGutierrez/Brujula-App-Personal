name: Wear OS APK
on:
  workflow_dispatch:
  pull_request:
    paths: ["wear/**", ".github/workflows/wear-apk.yml"]
  push:
    branches: [main]
    paths: ["wear/**", ".github/workflows/wear-apk.yml"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WEAR_KEYSTORE_PASSWORD: ${{ secrets.WEAR_KEYSTORE_PASSWORD }}
      WEAR_KEY_ALIAS: ${{ secrets.WEAR_KEY_ALIAS }}
      WEAR_KEY_PASSWORD: ${{ secrets.WEAR_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle -p wear :app:assembleDebug --stacktrace
      - name: Restore release keystore
        if: ${{ secrets.WEAR_KEYSTORE_BASE64 != '' }}
        env:
          WEAR_KEYSTORE_BASE64: ${{ secrets.WEAR_KEYSTORE_BASE64 }}
        run: |
          echo "$WEAR_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/brujula-wear.jks"
          echo "WEAR_KEYSTORE_PATH=$RUNNER_TEMP/brujula-wear.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: ${{ secrets.WEAR_KEYSTORE_BASE64 != '' }}
        run: gradle -p wear :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: brujula-wear-debug-apk
          path: wear/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ secrets.WEAR_KEYSTORE_BASE64 != '' }}
        with:
          name: brujula-wear-release-apk
          path: wear/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
